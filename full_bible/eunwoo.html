    html, body {

    }
    
    .app-header {
      height: 54px; padding-top: env(safe-area-inset-top, 0px); background: #1e293b; padding-left: 16px; padding-right: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 100;
    }
    .logo-title { font-size: 1.1rem; font-weight: 700; color: var(--accent-green); }
    .header-passage { font-weight: 700; color: var(--accent-gold); font-size: 0.95rem; }

    .app-container { flex: 1 1 auto; position: relative; overflow: hidden; width: 100%; }
    
    .tab-page { position: absolute; inset: 0; width: 100%; height: 100%; display: none; flex-direction: column; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .tab-page.active { display: flex !important; }

    .bible-verse-item { background: #1e293b; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--accent-green); font-size: 1.05rem; line-height: 1.7; word-break: keep-all; }
    .verse-num { font-weight: bold; color: #34d399; margin-right: 8px; font-size: 0.95rem; }
    
    .complete-card { background: #1e293b; border: 2px solid var(--accent-green); border-radius: 12px; padding: 18px; text-align: center; margin-top: 20px; margin-bottom: 24px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15); }
    .btn-complete { width: 100%; padding: 16px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-complete.not-completed { background: var(--accent-green); color: #ffffff; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
    .btn-complete.not-completed:hover { background: #059669; }
    .btn-complete.completed { background: #065f46; color: #34d399; border: 1px solid #10b981; }

    .journal-box { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .journal-box-title { font-size: 1.05rem; font-weight: bold; color: var(--accent-green); margin-bottom: 8px; }
    textarea { width: 100%; min-height: 160px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; padding: 12px; font-size: 1rem; resize: vertical; outline: none; line-height: 1.6; }

    .progress-box { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .progress-bar-bg { background: #0f172a; height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0; }
    .progress-bar-fill { background: linear-gradient(90deg, #10b981, #34d399); height: 100%; width: 0%; transition: width 0.3s ease; }

    .schedule-card { background: #1e293b; padding: 14px 18px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid var(--border-color); }
    .schedule-card.active { border-color: var(--accent-green); background: #064e3b; }
    .schedule-card.is-done { border-left: 4px solid var(--accent-green); }
    .schedule-meta { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px; }
    .schedule-passage { font-weight: bold; font-size: 1rem; }
    .check-badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; }
    .check-badge.checked { background: var(--accent-green); color: #fff; }
    .check-badge.unchecked { border: 1px solid var(--text-secondary); color: transparent; }

    .save-indicator { font-size: 0.8rem; color: #34d399; font-weight: bold; margin-top: 4px; display: none; }

    .mobile-bottom-nav {
      height: 60px; min-height: 60px; padding-bottom: env(safe-area-inset-bottom, 0px); background: #1e293b; border-top: 1px solid var(--border-color); display: flex; width: 100%; flex-shrink: 0; z-index: 1000;
    }
    .nav-tab-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-secondary); font-size: 0.85rem; font-weight: bold; cursor: pointer; border: none; background: none; }
    .nav-tab-item.active { color: var(--accent-green); background: #334155; }
    .nav-tab-icon { font-size: 1.25rem; margin-bottom: 2px; }

      <div id="bibleTextContainer"></div>
      
      <div class="complete-card">

          ✅ 오늘 말씀 통독 완료하기
        </button>
      </div>
    </section>

    <!-- TAB 2: 일기쓰기 -->
    <section id="tab-editor" class="tab-page">
      <div style="font-size: 1.1rem; font-weight: bold; color: var(--accent-green); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
        <span>✏️ 통독 일기 작성</span>
        <span class="save-indicator" id="saveIndicator">✓ 실시간 자동 저장됨</span>
      </div>
      <div class="journal-box">
        <div class="journal-box-title">📖 은혜받은 말씀</div>
        <textarea id="editorGrace" placeholder="오늘 성경을 읽으시면서 가슴을 울린 구절을 적어보세요." oninput="window.saveJournal()"></textarea>
      </div>
      <div class="journal-box">
        <div class="journal-box-title">💡 받은 교훈 및 적용</div>
        <textarea id="editorLesson" placeholder="깨달은 교훈과 삶의 결단, 기도제목을 적어보세요." oninput="window.saveJournal()"></textarea>
      </div>
    </section>

    <!-- TAB 3: 통독표 -->
    <section id="tab-schedule" class="tab-page">
      <div class="progress-box">
        <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 0.95rem;">
          <span>📊 통독 달성 진도율</span>
          <span id="progressPercent" style="color: var(--accent-green);">0%</span>
        </div>
        <div class="progress-bar-bg">

        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary);">
          <span>총 126일 진도</span>
          <span id="progressCount">0 / 126 일 완료</span>
        </div>
      </div>

      <div style="font-size: 1.1rem; font-weight: bold; color: var(--accent-green); margin-bottom: 12px;">
        📅 하반기 성경통독 일정표
      </div>
      <div id="scheduleListContainer"></div>
    </section>
  </div>

  <nav class="mobile-bottom-nav">

    function loadJournals() {
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved) journalData = JSON.parse(saved);
      } catch(e) {}
    }

    function saveJournals() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(journalData));
        var ind = document.getElementById('saveIndicator');
        if (ind) {
          ind.style.display = 'inline';
          setTimeout(function() { ind.style.display = 'none'; }, 2000);
        }
      } catch(e) {}
    }

    window.saveJournal = function() {
      if (!journalData[activeDay]) journalData[activeDay] = {};
      journalData[activeDay].grace = document.getElementById('editorGrace').value;
      journalData[activeDay].lesson = document.getElementById('editorLesson').value;
      saveJournals();
    };

    window.toggleComplete = function() {
      if (!journalData[activeDay]) journalData[activeDay] = {};
      journalData[activeDay].completed = !journalData[activeDay].completed;
      saveJournals();
      updateCompleteButtonUI();
      renderSchedule();
    };

    function updateCompleteButtonUI() {
      var btn = document.getElementById('btnToggleComplete');
      var badge = document.getElementById('readingStatusBadge');
      var isDone = journalData[activeDay] && journalData[activeDay].completed;
      if (btn) {
        if (isDone) {
          btn.className = 'btn-complete completed';
          btn.innerHTML = '🎉 오늘 말씀 통독 완료됨! (클릭 시 취소)';
        } else {
          btn.className = 'btn-complete not-completed';
          btn.innerHTML = '✅ 오늘 말씀 통독 완료하기';
        }
      }
      if (badge) {
        badge.innerText = isDone ? '완료됨' : '미완료';
        badge.style.background = isDone ? '#065f46' : '#334155';
        badge.style.color = isDone ? '#34d399' : '#94a3b8';
      }
    }

    window.switchTab = function(tabName) {
      activeTab = tabName;
      ['reader', 'editor', 'schedule'].forEach(function(t) {
        var page = document.getElementById('tab-' + t);
        var btn = document.getElementById('btn-tab-' + t);
        if (page) page.classList.toggle('active', t === tabName);
        if (btn) btn.classList.toggle('active', t === tabName);
      });
      if (tabName === 'editor') {
        var d = journalData[activeDay] || {};
        document.getElementById('editorGrace').value = d.grace || '';
        document.getElementById('editorLesson').value = d.lesson || '';
      } else if (tabName === 'schedule') {
        renderSchedule();
      }
    };

    function renderBible(item) {
      var container = document.getElementById('bibleTextContainer');
      if (!container) return;
      container.innerHTML = '';
      
      var bName = item.book;
      var db = window.BIBLE_FULL_DB ? window.BIBLE_FULL_DB[bName] : null;
      if (!db) {
        container.innerHTML = '<div style="padding:20px; color:#94a3b8;">' + bName + ' 본문 데이터를 불러오는 중...</div>';
        return;
      }
      
      var html = '';
      for (var c = item.startCh; c <= item.endCh; c++) {
        var chVerses = db[c] || db[String(c)];
        if (chVerses) {
          html += '<h4 style="color:var(--accent-gold); margin:18px 0 10px 0; font-size:1.1rem; border-bottom:1px solid #334155; padding-bottom:4px;">' + bName + ' ' + c + '장</h4>';
          for (var vNum in chVerses) {
            html += '<div class="bible-verse-item"><span class="verse-num">' + vNum + '</span>' + chVerses[vNum] + '</div>';
          }
        }
      }
      container.innerHTML = html;
      updateCompleteButtonUI();
    }

    function renderSchedule() {
      var container = document.getElementById('scheduleListContainer');
      if (!container) return;
      container.innerHTML = '';

      var completedCount = 0;
      scheduleData.forEach(function(item) {
        if (item.day === 0) return;
        var isDone = journalData[item.day] && journalData[item.day].completed;
        if (isDone) completedCount++;

        var card = document.createElement('div');
        card.className = 'schedule-card' + (item.day === activeDay ? ' active' : '') + (isDone ? ' is-done' : '');
        card.innerHTML = '<div><div class="schedule-meta">Day ' + item.day + ' | ' + item.date + '</div><div class="schedule-passage">' + item.passage + '</div></div><div class="check-badge ' + (isDone ? 'checked' : 'unchecked') + '">' + (isDone ? '✓' : '') + '</div>';
        card.onclick = function() {
          activeDay = item.day;
          var head = document.getElementById('headerPassage');
          if (head) head.innerText = item.passage;
          renderBible(item);
          renderSchedule();
          window.switchTab('reader');
        };
        container.appendChild(card);
      });

      var pct = Math.round((completedCount / 126) * 100);
      var pBar = document.getElementById('progressBarFill');
      var pPct = document.getElementById('progressPercent');
      var pCnt = document.getElementById('progressCount');
      if (pBar) pBar.style.width = pct + '%';
      if (pPct) pPct.innerText = pct + '%';
      if (pCnt) pCnt.innerText = completedCount + ' / 126 일 완료';
    }

    loadJournals();
    renderBible(scheduleData[1]);
    renderSchedule();
  })();
  </script>
